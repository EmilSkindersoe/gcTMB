# Builds the pkgdown website and publishes it to the gh-pages branch, from which GitHub Pages
# serves https://emilskindersoe.github.io/gcTMB/. Based on the r-lib/actions example workflow.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one build at a time
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::shinylive, local::.
          needs: website

      # pkgdown makes a web page of every .md file in the package folder; these are notes for
      # development, not documentation, so they are removed from the copy that is built
      - name: Remove development notes
        run: rm -f CLAUDE.md TODO.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # the viewcurves() app of the article "Exploring observed curves", run in the browser by
      # Shinylive; the exported files go only into the website, not into the repository
      - name: Export the Shinylive app
        run: Rscript vignettes/articles/viewcurves-app/export.R docs

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
